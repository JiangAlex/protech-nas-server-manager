<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NAS Server Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-gray-50 min-h-screen" x-data="{ sidebarOpen: true }">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 text-white flex-shrink-0 flex flex-col"
               x-show="sidebarOpen"
               x-transition>
            <!-- Logo -->
            <div class="p-4 border-b border-gray-700">
                <h1 class="text-lg font-bold">🖥️ NAS Manager</h1>
                <p class="text-xs text-gray-400 mt-1">Protech Server Manager</p>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 p-4 space-y-1">
                <a href="/admin/"
                   class="flex items-center px-3 py-2 rounded-lg text-sm hover:bg-gray-800 bg-gray-800 text-white">
                    <span class="mr-3">📊</span> Dashboard
                </a>
                <a href="/admin/devices/"
                   class="flex items-center px-3 py-2 rounded-lg text-sm hover:bg-gray-800 ">
                    <span class="mr-3">💻</span> 設備管理
                </a>
                <a href="/admin/device-types/"
                   class="flex items-center px-3 py-2 rounded-lg text-sm hover:bg-gray-800 ">
                    <span class="mr-3">📁</span> 設備類型
                </a>
                <a href="/admin/firmware/"
                   class="flex items-center px-3 py-2 rounded-lg text-sm hover:bg-gray-800 ">
                    <span class="mr-3">📦</span> 韌體版本
                </a>
                <a href="/admin/updates/"
                   class="flex items-center px-3 py-2 rounded-lg text-sm hover:bg-gray-800 ">
                    <span class="mr-3">🔄</span> 更新紀錄
                </a>
                <a href="/admin/batch-update/"
                   class="flex items-center px-3 py-2 rounded-lg text-sm hover:bg-gray-800 ">
                    <span class="mr-3">🚀</span> 群發更新
                </a>
                <a href="/admin/notifications/"
                   class="flex items-center px-3 py-2 rounded-lg text-sm hover:bg-gray-800 ">
                    <span class="mr-3">🔔</span> 通知設定
                </a>
            </nav>

            <!-- User info -->
            <div class="p-4 border-t border-gray-700">
                <div class="flex items-center justify-between">
                    <span class="text-sm text-gray-300">👤 admin</span>
                    <a href="/admin/logout" class="text-xs text-gray-400 hover:text-white">登出</a>
                </div>
            </div>
        </aside>

        <!-- Main content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Top bar -->
            <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-3 flex items-center justify-between">
                <button @click="sidebarOpen = !sidebarOpen" class="text-gray-600 hover:text-gray-900">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <h2 class="text-lg font-semibold text-gray-800">Dashboard</h2>
                <div class="text-sm text-gray-500">v0.1.0</div>
            </header>

            <!-- Page content -->
            <main class="flex-1 overflow-y-auto p-6">
                
<!-- Status cards -->
<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-white rounded-lg shadow p-5">
        <div class="flex items-center">
            <div class="bg-blue-100 text-blue-600 p-3 rounded-full">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
            </div>
            <div class="ml-4">
                <p class="text-sm text-gray-500">總設備數</p>
                <p class="text-2xl font-bold text-gray-800">1</p>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow p-5">
        <div class="flex items-center">
            <div class="bg-green-100 text-green-600 p-3 rounded-full">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                </svg>
            </div>
            <div class="ml-4">
                <p class="text-sm text-gray-500">在線</p>
                <p class="text-2xl font-bold text-green-600">1</p>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow p-5">
        <div class="flex items-center">
            <div class="bg-red-100 text-red-600 p-3 rounded-full">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                </svg>
            </div>
            <div class="ml-4">
                <p class="text-sm text-gray-500">離線</p>
                <p class="text-2xl font-bold text-red-600">0</p>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow p-5">
        <div class="flex items-center">
            <div class="bg-yellow-100 text-yellow-600 p-3 rounded-full">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                </svg>
            </div>
            <div class="ml-4">
                <p class="text-sm text-gray-500">未知</p>
                <p class="text-2xl font-bold text-yellow-600">0</p>
            </div>
        </div>
    </div>
</div>

<!-- Device list table -->
<div class="bg-white rounded-lg shadow">
    <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
        <h3 class="text-lg font-semibold text-gray-800">設備列表</h3>
        <a href="/admin/devices/" class="text-blue-600 text-sm hover:underline">查看全部 →</a>
    </div>

    
    <div class="overflow-x-auto">
        <table class="w-full">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">名稱</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">IP</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">版本</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">狀態</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">最後上線</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
                
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4">
                        <a href="/admin/devices/1/" class="text-blue-600 hover:underline font-medium">
                            1
                        </a>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-600">192.168.131.150</td>
                    <td class="px-6 py-4 text-sm text-gray-600">1.0.0</td>
                    <td class="px-6 py-4">
                        
                        <span class="px-2 py-1 text-xs font-medium rounded-full bg-green-100 text-green-800">在線</span>
                        
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500">
                        2026-08-06 07:12
                    </td>
                </tr>
                
            </tbody>
        </table>
    </div>
    
</div>

            </main>
        </div>
    </div>

    
</body>
</html>
