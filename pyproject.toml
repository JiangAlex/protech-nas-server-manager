[project]
name = "protech-nas-server-manager"
version = "0.1.0"
description = "NAS 系統更新 Server - 管理多台 Protech NAS 設備的軟體版本、推送更新、監控狀態"
requires-python = ">=3.11"
license = {text = "Private"}
authors = [
    {name = "Protech Team"},
]

dependencies = [
    # Web Framework
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",

    # Web UI (Jinja2 templates)
    "jinja2==3.1.4",
    "python-multipart>=0.0.9",
    "itsdangerous==2.2.0",

    # Database
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.3",

    # SSH Remote Operations
    "asyncssh==2.17.0",

    # Docker Control
    "docker==7.1.0",

    # Telegram Notification
    "python-telegram-bot==21.6",

    # LINE Notification
    "line-bot-sdk==3.13.0",

    # Discord Notification
    "discord.py==2.4.0",

    # HTTP Client
    "httpx==0.27.2",

    # Auth
    "passlib[bcrypt]==1.7.4",

    # Utilities
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "apscheduler==3.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "ruff==0.6.9",
    "mypy==1.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
