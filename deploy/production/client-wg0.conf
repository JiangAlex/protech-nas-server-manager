# WireGuard VPN Client Configuration Template
# ============================================
# Save this as /path/to/client-wg0.conf on the client's device.
# Each client gets a unique PrivateKey and Address.
#
# On the client device, install WireGuard and import this config:
#   Linux/macOS:  sudo wg-quick up wg0
#   Windows:      import via WireGuard GUI
#   Android/iOS:  import via WireGuard app (scan QR from this file)

[Interface]
# Generate this client's private key on the CLIENT machine (never share PrivateKey)
#   wg genkey > client_private.key
PrivateKey = <CLIENT_PRIVATE_KEY>

# This client's VPN address — must be unique per client, from 10.10.10.0/24
Address = 10.10.10.2/24

# DNS servers used inside the VPN tunnel (Cloudflare + Google)
DNS = 1.1.1.1, 8.8.8.8

[Peer]
# Server's public key — copy from the server's wg0.conf PublicKey field
PublicKey = <SERVER_PUBLIC_KEY>

# Server endpoint: domain or IP, same port WireGuard ListenPort (51820)
Endpoint = your-domain.com:51820

# Full tunnel (route ALL traffic through VPN):
AllowedIPs = 0.0.0.0/0, ::/0

# Split tunnel (only route 10.10.10.0/24 through VPN, everything else direct):
# AllowedIPs = 10.10.10.0/24

# Maintain NAT mappings through middleboxes (needed for some strict NATs)
PersistentKeepalive = 25
