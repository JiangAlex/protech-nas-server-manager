# WireGuard VPN Server Configuration
# ====================================
# Deploy to: /etc/wireguard/wg0.conf
# Permissions: chmod 600 /etc/wireguard/wg0.conf
# Enable with: sudo systemctl enable wg-quick@wg0
# Start with:  sudo systemctl start wg-quick@wg0
# Check status: sudo wg show

[Interface]
# Server private key — GENERATE WITH: wg genkey | tee server_private.key | wg pubkey > server_public.key
PrivateKey = <SERVER_PRIVATE_KEY>

# WireGuard listening port
ListenPort = 51820

# Interface MTU — auto-detected, tweak if needed
MTU = 1420

# Server VPN network addresses
Address = 10.10.10.1/24

# DNS server pushed to clients (Cloudflare + Google)
DNS = 1.1.1.1, 8.8.8.8

# Persistent keepalive (25s) to maintain NAT mappings
PersistentKeepalive = 25

# ============================================================
# PostUp / PostDown iptables rules for NAT and packet forwarding
# ============================================================
# These commands run automatically when the interface goes up/down.
# Adjust the $-style shell variable names — wg-quick expands these.
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -A FORWARD -o wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o $(ip route show default | awk '{print $5}' | head -n1) -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -D FORWARD -o wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o $(ip route show default | awk '{print $5}' | head -n1) -j MASQUERADE

# ============================================================
# Client peers — add one [Peer] block per authorized client
# ============================================================
# To generate a client keypair on the server:
#   CLIENT_PUB=$(wg genkey | tee client_private.key | wg pubkey)
#   echo "$CLIENT_PUB"
#
# Client config file to hand to user (uses server's public key):
#   [Interface]
#   PrivateKey = <CLIENT_PRIVATE_KEY>
#   Address = 10.10.10.2/24
#   DNS = 1.1.1.1
#
#   [Peer]
#   PublicKey = <SERVER_PUBLIC_KEY>
#   Endpoint = your-domain.com:51820
#   AllowedIPs = 0.0.0.0/0, ::/0   # full tunnel
#   # AllowedIPs = 10.10.10.0/24   # split tunnel
#   PersistentKeepalive = 25

# --- Example Client 1 ---
[Peer]
# PublicKey = <CLIENT_1_PUBLIC_KEY>
PublicKey =
# PresharedKey = <CLIENT_1_PSK>   # Optional: add extra layer of post-quantum resistance
# AllowedIPs = 10.10.10.2/32
AllowedIPs =

# --- Example Client 2 ---
[Peer]
# PublicKey = <CLIENT_2_PUBLIC_KEY>
PublicKey =
# PresharedKey = <CLIENT_2_PSK>
# AllowedIPs = 10.10.10.3/32
AllowedIPs =
