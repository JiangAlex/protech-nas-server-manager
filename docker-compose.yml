version: "3.9"

services:
  # ============================================================
  # 應用程式服務 - FastAPI (NAS Server Manager)
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nas-manager-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Docker API access
    restart: unless-stopped
    networks:
      - nas-manager-network

networks:
  nas-manager-network:
    driver: bridge
