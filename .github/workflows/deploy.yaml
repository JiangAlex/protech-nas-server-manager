name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: protech/nas-server-manager
  SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
  SERVER_USER: ${{ secrets.DEPLOY_USER }}

jobs:
  deploy:
    name: ssh-deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,suffix=,format=raw
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE }}:${{ github.sha }}
            docker-compose -f /opt/protech-nas/docker-compose.yml pull
            docker-compose -f /opt/protech-nas/docker-compose.yml up -d --no-build
            docker image prune -f -a --filter "until=48h" || true
